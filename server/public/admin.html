<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Panel de Administración — Los Olivos</title>
<style>
  :root {
    --olive-dark: #46552c;
    --olive: #6f8b3f;
    --olive-light: #a9c25a;
    --neon: #d4ff5e;
    --graphite: #0b0e0c;
    --graphite-soft: #161b17;
    --metal: #a7b1ac;
    --metal-light: #e4eae6;
    --danger: #e5484d;
    --ok: #46a758;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background: var(--graphite);
    color: var(--metal-light);
    min-height: 100vh;
  }
  button {
    font: inherit; cursor: pointer; border: none; border-radius: 8px;
    padding: 7px 12px; font-weight: 600; font-size: .88rem; transition: filter .15s, transform .05s;
  }
  button:hover { filter: brightness(1.12); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  /* ── Login ── */
  #view-login {
    display: none; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
  }
  #view-login.active { display: flex; }
  .login-box {
    background: var(--graphite-soft); border: 1px solid #2a3328;
    border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .login-brand { text-align: center; margin-bottom: 28px; }
  .login-brand .logo-dot {
    display: inline-block; width: 12px; height: 12px; border-radius: 3px;
    background: var(--neon); margin-right: 8px;
  }
  .login-brand h1 { font-size: 1.15rem; letter-spacing: .12em; text-transform: uppercase; }
  .login-brand p { color: var(--metal); font-size: .85rem; margin-top: 6px; }
  .login-box input {
    width: 100%; padding: 12px 14px; border-radius: 8px; font-size: 1rem;
    border: 1px solid #2a3328; background: #0f130f; color: var(--metal-light);
    outline: none; margin-bottom: 14px;
  }
  .login-box input:focus { border-color: var(--olive); }
  .btn-login {
    width: 100%; background: var(--olive); color: #0b0e0c;
    font-weight: 700; letter-spacing: .04em;
  }
  .login-error { color: var(--danger); font-size: .85rem; text-align: center; min-height: 1.2em; margin-bottom: 8px; }

  /* ── Panel ── */
  #view-panel { display: none; }
  #view-panel.active { display: block; }
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: rgba(11,14,12,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid #232b21; padding: 14px 22px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .topbar .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: .95rem; }
  .topbar .brand .logo-dot { width: 10px; height: 10px; border-radius: 3px; background: var(--neon); }
  .topbar .spacer { flex: 1; }
  .btn-ghost { background: transparent; color: var(--metal); border: 1px solid #2a3328; padding: 8px 14px; font-size: .85rem; }
  .btn-ghost:hover { color: var(--metal-light); border-color: var(--olive); }

  .tabs { display: flex; gap: 8px; padding: 18px 22px 0; flex-wrap: wrap; }
  .tab {
    background: var(--graphite-soft); color: var(--metal); border: 1px solid #232b21;
    padding: 8px 16px; font-size: .85rem; border-radius: 999px;
  }
  .tab .count { background: #232b21; border-radius: 999px; padding: 1px 8px; margin-left: 6px; font-size: .75rem; }
  .tab.active { background: var(--olive); color: #0b0e0c; border-color: var(--olive); }
  .tab.active .count { background: rgba(0,0,0,.25); color: inherit; }
  .tab.pending-glow .count { color: var(--neon); }

  .list { padding: 18px 22px 60px; display: grid; gap: 20px; max-width: 1080px; margin: 0 auto; }
  .empty { text-align: center; color: var(--metal); padding: 60px 0; font-size: .95rem; }

  .aviso-card {
    background: var(--graphite-soft); border: 1px solid #232b21;
    border-radius: 16px; overflow: hidden;
  }
  .aviso-head {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 16px 20px; border-bottom: 1px solid #232b21;
  }
  .aviso-head .who { font-weight: 700; }
  .aviso-head .meta { color: var(--metal); font-size: .8rem; }
  .chip {
    border-radius: 999px; padding: 3px 12px; font-size: .75rem; font-weight: 700;
    letter-spacing: .05em; text-transform: uppercase;
  }
  .chip.pendiente { background: rgba(212,255,94,.12); color: var(--neon); border: 1px solid rgba(212,255,94,.35); }
  .chip.publicado { background: rgba(70,167,88,.15); color: #7fd68c; border: 1px solid rgba(70,167,88,.4); }
  .chip.rechazado { background: rgba(229,72,77,.12); color: #ff8f94; border: 1px solid rgba(229,72,77,.4); }
  .chip.expirado { background: rgba(167,177,172,.12); color: var(--metal); border: 1px solid #2a3328; }
  .aviso-head .spacer { flex: 1; }

  .aviso-body { display: grid; grid-template-columns: 380px 1fr; }
  @media (max-width: 860px) { .aviso-body { grid-template-columns: 1fr; } }

  .card-preview { padding: 20px; }
  .card-preview canvas {
    width: 100%; height: auto; display: block; border-radius: 12px;
    border: 1px solid #232b21; cursor: zoom-in;
  }
  .preview-placeholder {
    width: 100%; aspect-ratio: 1200/630; border-radius: 12px;
    border: 1px dashed #2a3328; display: flex; align-items: center; justify-content: center;
    color: var(--metal); font-size: .85rem;
  }

  .card-actions { padding: 20px 20px 20px 0; display: flex; flex-direction: column; gap: 14px; }
  @media (max-width: 860px) { .card-actions { padding: 0 20px 20px; } }
  .aviso-comment {
    background: #0f130f; border: 1px solid #232b21; border-radius: 10px;
    padding: 12px 14px; font-size: .92rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  .aviso-contact { color: var(--metal); font-size: .82rem; }
  .aviso-contact strong { color: var(--metal-light); font-weight: 600; }

  .fb-text-label { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--olive-light); margin-bottom: 6px; }
  .fb-text {
    background: #0f130f; border: 1px solid #232b21; border-radius: 10px;
    padding: 12px 14px; font-size: .88rem; line-height: 1.55;
    white-space: pre-wrap; word-break: break-word; max-height: 180px; overflow: auto;
  }
  .obs-box { background: rgba(229,72,77,.06); border: 1px solid rgba(229,72,77,.25); border-radius: 10px; padding: 10px 14px; font-size: .85rem; color: #ff8f94; }

  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .btn-primary { background: var(--olive); color: #0b0e0c; }
  .btn-secondary { background: #232b21; color: var(--metal-light); border: 1px solid #2a3328; }
  .btn-ok { background: var(--ok); color: #07130a; }
  .btn-danger { background: transparent; color: #ff8f94; border: 1px solid rgba(229,72,77,.45); }
  .btn-danger:hover { background: rgba(229,72,77,.12); }
  .btn-fb { background: #1877f2; color: #fff; }

  .reject-form { display: none; gap: 8px; flex-direction: column; background: rgba(229,72,77,.05); border: 1px solid rgba(229,72,77,.25); border-radius: 10px; padding: 12px; }
  .reject-form.open { display: flex; }
  .reject-form input {
    padding: 9px 12px; border-radius: 8px; border: 1px solid #2a3328;
    background: #0f130f; color: var(--metal-light); outline: none; font: inherit; font-size: .88rem;
  }

  /* ── Lightbox ── */
  #lightbox {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(5,7,5,.92); padding: 24px;
    align-items: center; justify-content: center; flex-direction: column; gap: 16px;
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 100%; max-height: 82vh; border-radius: 12px; border: 1px solid #2a3328; }
  #lightbox .hint { color: var(--metal); font-size: .85rem; }

  /* ── Toast ── */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--olive); color: #0b0e0c; font-weight: 700; border-radius: 999px;
    padding: 12px 22px; font-size: .9rem; z-index: 60; transition: transform .25s;
    box-shadow: 0 10px 30px rgba(0,0,0,.45); max-width: 90vw; text-align: center;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.err { background: var(--danger); color: #fff; }
</style>
</head>
<body>

<section id="view-login">
  <form class="login-box" id="login-form">
    <div class="login-brand">
      <div><span class="logo-dot"></span><strong style="letter-spacing:.14em">LOS OLIVOS</strong></div>
      <h1>Panel de Administración</h1>
      <p>Avisos y preparación de publicaciones para Facebook</p>
    </div>
    <input type="password" id="login-pass" placeholder="Contraseña de acceso" autocomplete="current-password" required />
    <div class="login-error" id="login-error"></div>
    <button type="submit" class="btn-login">Entrar</button>
  </form>
</section>

<section id="view-panel">
  <header class="topbar">
    <div class="brand"><span class="logo-dot"></span>Los Olivos — Panel de Avisos</div>
    <div class="spacer"></div>
    <button class="btn-ghost" id="btn-refresh" type="button">↻ Actualizar</button>
    <button class="btn-ghost" id="btn-logout" type="button">Salir</button>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main class="list" id="list"></main>
</section>

<div id="lightbox"><img id="lightbox-img" alt="Tarjeta Facebook" /><div class="hint">Clic en la imagen o ESC para cerrar</div></div>
<div id="toast"></div>

<script>
(function () {
  'use strict';

  var SESSION_KEY = 'olivos_admin_pass';
  var state = { pass: '', avisos: [], fbGroupUrl: '', filter: 'pendiente' };

  var viewLogin = document.getElementById('view-login');
  var viewPanel = document.getElementById('view-panel');
  var listEl = document.getElementById('list');
  var tabsEl = document.getElementById('tabs');
  var toastEl = document.getElementById('toast');
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightbox-img');

  /* ── utilidades ── */
  function authHeaders() {
    return { 'Content-Type': 'application/json', 'x-admin-password': state.pass };
  }
  function toast(msg, isErr) {
    toastEl.textContent = msg;
    toastEl.className = isErr ? 'err show' : 'show';
    setTimeout(function () { toastEl.className = ''; }, 2600);
  }
  function fmtDate(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    return d.toLocaleDateString('es-CL', { day: '2-digit', month: 'short', year: 'numeric' }) +
      ' ' + d.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function isExpired(aviso) {
    return !!(aviso.expires_at && new Date(aviso.expires_at).getTime() < Date.now());
  }

  /* ── sesión ── */
  function showLogin() {
    state.pass = '';
    sessionStorage.removeItem(SESSION_KEY);
    viewPanel.classList.remove('active');
    viewLogin.classList.add('active');
  }
  function showPanel() {
    viewLogin.classList.remove('active');
    viewPanel.classList.add('active');
  }

  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var pass = document.getElementById('login-pass').value;
    document.getElementById('login-error').textContent = '';
    fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pass })
    }).then(function (r) {
      if (!r.ok) throw new Error();
      state.pass = pass;
      sessionStorage.setItem(SESSION_KEY, pass);
      showPanel();
      return loadAll();
    }).catch(function () {
      document.getElementById('login-error').textContent = 'Contraseña incorrecta';
    });
  });

  document.getElementById('btn-logout').addEventListener('click', function () { showLogin(); });
  document.getElementById('btn-refresh').addEventListener('click', function () { loadAll(); });

  /* ── datos ── */
  function handle401(r) {
    if (r.status === 401) { showLogin(); throw new Error('Sesión expirada'); }
    return r;
  }

  function loadAll() {
    return Promise.all([
      fetch('/api/admin/avisos', { headers: authHeaders() }).then(handle401).then(function (r) { return r.json(); }),
      fetch('/api/admin/config', { headers: authHeaders() }).then(handle401).then(function (r) { return r.json(); })
    ]).then(function (res) {
      state.avisos = res[0].avisos || [];
      state.fbGroupUrl = res[1].fb_group_url || '';
      render();
    }).catch(function (err) {
      if (err.message !== 'Sesión expirada') toast('Error al cargar avisos', true);
    });
  }

  function setEstado(aviso, estado, observaciones) {
    var body = { estado: estado };
    if (typeof observaciones === 'string') body.observaciones = observaciones;
    return fetch('/api/admin/avisos/' + aviso.id + '/facebook', {
      method: 'PATCH',
      headers: authHeaders(),
      body: JSON.stringify(body)
    }).then(handle401).then(function (r) {
      if (!r.ok) throw new Error();
      return r.json();
    }).then(function () {
      toast(estado === 'publicado' ? 'Aviso marcado como publicado ✓'
        : estado === 'rechazado' ? 'Aviso rechazado'
        : 'Aviso vuelto a pendiente');
      return loadAll();
    }).catch(function (err) {
      if (err.message !== 'Sesión expirada') toast('No se pudo actualizar', true);
    });
  }

  /* ── tarjeta Facebook (canvas 1200x630) ── */
  function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
    var words = String(text || '').trim().split(/\s+/);
    var lines = [], line = '';
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = words[i];
        if (lines.length === maxLines) break;
      } else {
        line = test;
      }
    }
    if (lines.length < maxLines && line) lines.push(line);
    else if (lines.length === maxLines && line) {
      var last = lines[maxLines - 1];
      if (ctx.measureText(last + '…').width <= maxWidth) lines[maxLines - 1] = last + '…';
      else lines[maxLines - 1] = last.slice(0, -1) + '…';
    }
    for (var j = 0; j < lines.length; j++) ctx.fillText(lines[j], x, y + j * lineHeight);
    return lines.length;
  }

  function drawCard(aviso) {
    var W = 1200, H = 630;
    var canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext('2d');

    var drawText = function () {
      /* overlay de legibilidad */
      var grad = ctx.createLinearGradient(0, H * 0.28, 0, H);
      grad.addColorStop(0, 'rgba(11,14,12,0)');
      grad.addColorStop(1, 'rgba(11,14,12,0.93)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, H * 0.28, W, H * 0.72);
      ctx.fillStyle = 'rgba(11,14,12,0.25)';
      ctx.fillRect(0, 0, W, H * 0.28);

      /* marca arriba */
      ctx.fillStyle = '#d4ff5e';
      ctx.fillRect(48, 44, 12, 12);
      ctx.font = 'bold 24px "Segoe UI", Arial, sans-serif';
      ctx.fillStyle = '#e4eae6';
      ctx.textBaseline = 'middle';
      ctx.fillText('COMERCIALIZADORA LOS OLIVOS', 74, 51);

      /* chip AVISO VECINAL */
      ctx.font = 'bold 19px "Segoe UI", Arial, sans-serif';
      var chipW = ctx.measureText('AVISO VECINAL').width + 36;
      ctx.fillStyle = 'rgba(111,139,63,0.9)';
      roundRect(ctx, 48, 90, chipW, 34, 17); ctx.fill();
      ctx.fillStyle = '#0b0e0c';
      ctx.fillText('AVISO VECINAL', 66, 108);

      /* texto del aviso */
      ctx.font = 'bold 36px "Segoe UI", Arial, sans-serif';
      ctx.fillStyle = '#ffffff';
      wrapText(ctx, aviso.comment, 48, 310, W - 96, 48, 4);

      /* contacto */
      ctx.font = '600 26px "Segoe UI", Arial, sans-serif';
      ctx.fillStyle = '#d4ff5e';
      ctx.fillText(aviso.name + '  ·  ' + aviso.phone, 48, 512);

      /* datos del negocio */
      ctx.font = '22px "Segoe UI", Arial, sans-serif';
      ctx.fillStyle = '#a7b1ac';
      ctx.fillText('Concordia 408, Local A, Peñaflor  ·  Lun a Sáb 10:00–20:00 hrs', 48, 556);
      ctx.fillStyle = '#a9c25a';
      ctx.fillText('instagram.com/comercializadora_los_olivos_', 48, 588);

      /* barra neón inferior */
      ctx.fillStyle = '#d4ff5e';
      ctx.fillRect(0, H - 14, W, 14);
      ctx.fillStyle = '#6f8b3f';
      ctx.fillRect(0, H - 18, W, 4);
    };

    if (aviso.image_url) {
      fetch('/api/admin/avisos/' + aviso.id + '/image', { headers: { 'x-admin-password': state.pass } })
        .then(handle401).then(function (r) {
          if (!r.ok) throw new Error('sin imagen');
          return r.blob();
        }).then(function (blob) { return createImageBitmap(blob); })
        .then(function (img) {
          var scale = Math.max(W / img.width, H / img.height);
          var dw = img.width * scale, dh = img.height * scale;
          ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
          drawText();
          canvas.dispatchEvent(new CustomEvent('card:ready'));
        }).catch(function () {
          drawBrandedBg(ctx, W, H);
          drawText();
          canvas.dispatchEvent(new CustomEvent('card:ready'));
        });
    } else {
      drawBrandedBg(ctx, W, H);
      drawText();
      queueMicrotask(function () { canvas.dispatchEvent(new CustomEvent('card:ready')); });
    }
    return canvas;
  }

  function drawBrandedBg(ctx, W, H) {
    var g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#0b0e0c');
    g.addColorStop(1, '#33401f');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(212,255,94,0.12)';
    ctx.lineWidth = 2;
    for (var i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.arc(W - 130, 120 + i * 95, 40 + i * 24, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ── acciones ── */
  function copyText(aviso, btn) {
    var text = aviso.facebook && aviso.facebook.texto ? aviso.facebook.texto : '';
    function done() { toast('Texto copiado al portapapeles ✓'); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text); done(); });
    } else {
      fallbackCopy(text); done();
    }
    btn.blur();
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  function downloadImage(aviso) {
    var canvas = drawCard(aviso);
    var done = false;
    var doDownload = function () {
      if (done) return;
      done = true;
      canvas.toBlob(function (blob) {
        if (!blob) { toast('No se pudo generar la imagen', true); return; }
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'aviso-' + aviso.id + '-facebook.png';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        toast('Imagen descargada ✓');
      }, 'image/png');
    };
    canvas.addEventListener('card:ready', doDownload);
    setTimeout(doDownload, 4000);
  }

  /* ── render ── */
  var FILTERS = [
    { key: 'pendiente', label: 'Pendientes' },
    { key: 'publicado', label: 'Publicados' },
    { key: 'rechazado', label: 'Rechazados' },
    { key: 'todos', label: 'Todos' }
  ];

  function fbOf(aviso) { return aviso.facebook || null; }

  function render() {
    var counts = { pendiente: 0, publicado: 0, rechazado: 0, todos: state.avisos.length };
    state.avisos.forEach(function (a) {
      var fb = fbOf(a);
      var est = fb ? fb.estado : 'sin-registro';
      if (counts[est] != null) counts[est]++;
    });

    tabsEl.innerHTML = '';
    FILTERS.forEach(function (f) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tab' + (state.filter === f.key ? ' active' : '') + (f.key === 'pendiente' && counts.pendiente > 0 ? ' pending-glow' : '');
      b.innerHTML = escapeHtml(f.label) + '<span class="count">' + (counts[f.key] || 0) + '</span>';
      b.addEventListener('click', function () { state.filter = f.key; render(); });
      tabsEl.appendChild(b);
    });

    var items = state.avisos.filter(function (a) {
      var fb = fbOf(a);
      if (state.filter === 'todos') return true;
      return fb && fb.estado === state.filter;
    });

    listEl.innerHTML = '';
    if (!items.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = state.filter === 'pendiente' ? 'No hay avisos pendientes. ¡Todo al día!' : 'No hay avisos en esta categoría.';
      listEl.appendChild(empty);
      return;
    }
    items.forEach(function (aviso) { listEl.appendChild(renderAviso(aviso)); });
  }

  function renderAviso(aviso) {
    var fb = fbOf(aviso);
    var estado = fb ? fb.estado : 'sin-registro';
    var expired = isExpired(aviso);

    var card = document.createElement('article');
    card.className = 'aviso-card';

    /* cabecera */
    var head = document.createElement('div');
    head.className = 'aviso-head';
    head.innerHTML =
      '<span class="who">' + escapeHtml(aviso.name) + '</span>' +
      '<span class="meta">Aviso #' + aviso.id + ' · ' + escapeHtml(fmtDate(aviso.created_at)) + '</span>' +
      (expired ? '<span class="chip expirado">Expirado en la web</span>' : '') +
      '<span class="spacer"></span>' +
      (estado === 'pendiente' ? '<span class="chip pendiente">Pendiente</span>' : '') +
      (estado === 'publicado' ? '<span class="chip publicado">Publicado</span>' : '') +
      (estado === 'rechazado' ? '<span class="chip rechazado">Rechazado</span>' : '') +
      (estado === 'sin-registro' ? '<span class="chip expirado">Sin registro Facebook</span>' : '');
    card.appendChild(head);

    var body = document.createElement('div');
    body.className = 'aviso-body';

    /* vista previa de la tarjeta */
    var preview = document.createElement('div');
    preview.className = 'card-preview';
    if (fb && fb.texto) {
      var canvas = drawCard(aviso);
      canvas.title = 'Clic para ver en grande';
      canvas.addEventListener('click', function () {
        lightboxImg.src = canvas.toDataURL('image/png');
        lightbox.classList.add('open');
      });
      preview.appendChild(canvas);
    } else {
      var ph = document.createElement('div');
      ph.className = 'preview-placeholder';
      ph.textContent = 'Aviso anterior al sistema de Facebook — sin tarjeta';
      preview.appendChild(ph);
    }
    body.appendChild(preview);

    /* acciones */
    var actions = document.createElement('div');
    actions.className = 'card-actions';

    var comment = document.createElement('div');
    comment.className = 'aviso-comment';
    comment.textContent = aviso.comment;
    actions.appendChild(comment);

    var contact = document.createElement('div');
    contact.className = 'aviso-contact';
    contact.innerHTML = '<strong>Contacto:</strong> ' + escapeHtml(aviso.name) +
      ' · 📞 ' + escapeHtml(aviso.phone) + ' · ✉ ' + escapeHtml(aviso.email);
    actions.appendChild(contact);

    if (fb && fb.texto) {
      var lbl = document.createElement('div');
      lbl.className = 'fb-text-label';
      lbl.textContent = 'Texto para Facebook (generado automáticamente)';
      actions.appendChild(lbl);

      var pre = document.createElement('div');
      pre.className = 'fb-text';
      pre.textContent = fb.texto;
      actions.appendChild(pre);
    }

    if (estado === 'publicado' && fb && fb.fecha_publicacion) {
      var pub = document.createElement('div');
      pub.className = 'aviso-contact';
      pub.innerHTML = '<strong>Publicado:</strong> ' + escapeHtml(fmtDate(fb.fecha_publicacion));
      actions.appendChild(pub);
    }
    if (estado === 'rechazado' && fb && fb.observaciones) {
      var obs = document.createElement('div');
      obs.className = 'obs-box';
      obs.textContent = 'Observaciones: ' + fb.observaciones;
      actions.appendChild(obs);
    }

    if (fb) {
      var row = document.createElement('div');
      row.className = 'btn-row';

      var bPrep = document.createElement('button');
      bPrep.type = 'button'; bPrep.className = 'btn-primary';
      bPrep.textContent = '🚀 Preparar publicación (1 clic)';
      bPrep.addEventListener('click', function () {
        window.open(state.fbGroupUrl, '_blank', 'noopener');
        copyText(aviso, bPrep);
        downloadImage(aviso);
        toast('Grupo abierto · texto copiado · imagen descargada');
      });
      row.appendChild(bPrep);

      var bCopy = document.createElement('button');
      bCopy.type = 'button'; bCopy.className = 'btn-secondary';
      bCopy.textContent = '⧉ Copiar texto';
      bCopy.addEventListener('click', function () { copyText(aviso, bCopy); });
      row.appendChild(bCopy);

      var bDown = document.createElement('button');
      bDown.type = 'button'; bDown.className = 'btn-secondary';
      bDown.textContent = '↓ Descargar imagen';
      bDown.addEventListener('click', function () { downloadImage(aviso); });
      row.appendChild(bDown);

      var bFb = document.createElement('button');
      bFb.type = 'button'; bFb.className = 'btn-fb';
      bFb.textContent = 'Abrir grupo de Facebook';
      bFb.addEventListener('click', function () {
        window.open(state.fbGroupUrl, '_blank', 'noopener');
      });
      row.appendChild(bFb);

      if (estado === 'pendiente') {
        var bOk = document.createElement('button');
        bOk.type = 'button'; bOk.className = 'btn-ok';
        bOk.textContent = '✓ Marcar como publicado';
        bOk.addEventListener('click', function () { setEstado(aviso, 'publicado'); });
        row.appendChild(bOk);

        var bNo = document.createElement('button');
        bNo.type = 'button'; bNo.className = 'btn-danger';
        bNo.textContent = '✗ Rechazar';
        bNo.addEventListener('click', function () {
          var form = card.querySelector('.reject-form');
          if (form) form.classList.toggle('open');
        });
        row.appendChild(bNo);
      } else {
        var bRe = document.createElement('button');
        bRe.type = 'button'; bRe.className = 'btn-secondary';
        bRe.textContent = '↺ Volver a pendiente';
        bRe.addEventListener('click', function () { setEstado(aviso, 'pendiente', ''); });
        row.appendChild(bRe);
      }
      actions.appendChild(row);

      if (estado === 'pendiente') {
        var rform = document.createElement('div');
        rform.className = 'reject-form';
        var rinput = document.createElement('input');
        rinput.type = 'text';
        rinput.placeholder = 'Observaciones (opcional)';
        var rrow = document.createElement('div');
        rrow.className = 'btn-row';
        var rConfirm = document.createElement('button');
        rConfirm.type = 'button'; rConfirm.className = 'btn-danger';
        rConfirm.textContent = 'Confirmar rechazo';
        rConfirm.addEventListener('click', function () {
          setEstado(aviso, 'rechazado', rinput.value);
        });
        var rCancel = document.createElement('button');
        rCancel.type = 'button'; rCancel.className = 'btn-secondary';
        rCancel.textContent = 'Cancelar';
        rCancel.addEventListener('click', function () { rform.classList.remove('open'); });
        rrow.appendChild(rConfirm); rrow.appendChild(rCancel);
        rform.appendChild(rinput); rform.appendChild(rrow);
        actions.appendChild(rform);
      }
    }

    body.appendChild(actions);
    card.appendChild(body);
    return card;
  }

  /* ── lightbox ── */
  lightbox.addEventListener('click', function () { lightbox.classList.remove('open'); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') lightbox.classList.remove('open');
  });

  /* ── inicio ── */
  var saved = sessionStorage.getItem(SESSION_KEY);
  if (saved) {
    state.pass = saved;
    showPanel();
    loadAll();
  } else {
    showLogin();
  }
})();
</script>
</body>
</html>
