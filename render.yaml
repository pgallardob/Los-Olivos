# Render.com — Configuración de despliegue para los backends
# Documentación: https://render.com/docs/blueprint-spec
# Gratis: 750 horas/mes (suficiente para 2 servicios con spin-down)

services:

  # ─── Backend Chatbot (IA + Gemini + Supabase) ───
  - type: web
    name: los-olivos-chatbot
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3002
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-2.0-flash
      - key: TZ
        value: America/Santiago
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX
        value: 15
      - key: MAX_MESSAGE_LENGTH
        value: 500

  # ─── Backend Avisos (Resend + Supabase) ───
  - type: web
    name: los-olivos-avisos
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: CLIENT_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: "Los Olivos <onboarding@resend.dev>"
      - key: MAIL_TO
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
